name: Language Tool CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: language-tool-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static web application
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Validate HTML structure and local assets
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          root = Path(".")
          html_path = root / "index.html"
          app_path = root / "app.js"
          css_path = root / "styles.css"

          for path in (html_path, app_path, css_path, root / "vendor/lucide.min.js"):
              if not path.is_file():
                  raise SystemExit(f"Required application file is missing: {path}")

          class DocumentCheck(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = set()
                  self.assets = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  element_id = attrs.get("id")
                  if element_id:
                      if element_id in self.ids:
                          raise ValueError(f"Duplicate HTML id: {element_id}")
                      self.ids.add(element_id)
                  if tag == "script" and attrs.get("src"):
                      self.assets.append(attrs["src"].split("?", 1)[0])
                  if tag == "link" and attrs.get("rel") == "stylesheet" and attrs.get("href"):
                      self.assets.append(attrs["href"].split("?", 1)[0])

          document = DocumentCheck()
          document.feed(html_path.read_text(encoding="utf-8"))
          document.close()

          for asset in document.assets:
              if asset.startswith(("http://", "https://", "//")):
                  continue
              if not (root / asset).is_file():
                  raise SystemExit(f"Referenced local asset does not exist: {asset}")

          js = app_path.read_text(encoding="utf-8")
          referenced_ids = set(re.findall(
              r"""(?:querySelector|getElementById)\(['"]#?([A-Za-z][A-Za-z0-9_-]*)['"]\)""",
              js,
          ))
          missing_ids = sorted(referenced_ids - document.ids)
          if missing_ids:
              raise SystemExit("JavaScript references missing HTML ids: " + ", ".join(missing_ids))

          required_ids = {
              "sourceLanguage", "targetLanguage", "sourceText", "outputText",
              "translateButton", "historyList", "savedList", "statusMessage",
          }
          missing_required = sorted(required_ids - document.ids)
          if missing_required:
              raise SystemExit("Required application controls are missing: " + ", ".join(missing_required))

          print(f"HTML validation passed: {len(document.ids)} unique ids and {len(document.assets)} local assets checked.")
          PY
