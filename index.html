<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Translate text between languages with Lingua.">
  <title>Lingua — Translate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=page-flip-20261111">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="#translateView" aria-label="Lingua home" id="homeLink">
        <span class="brand-icon" aria-hidden="true"><i data-lucide="languages"></i></span>
        <span class="brand-copy"><small>LANGUAGE TOOL</small><strong>Lingua</strong></span>
      </a>
    </header>

    <div class="view-shell">
      <section class="view active" id="translateView" aria-label="Text translation">
        <section class="language-pair" aria-label="Choose languages">
          <div class="language-field">
            <button class="field-label picker-label" id="sourceLanguageCaption" type="button" aria-controls="sourceLanguageMenu" aria-expanded="false">Source language</button>
            <div class="language-picker" data-language-picker>
              <button class="language-trigger" id="sourceLanguageTrigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="sourceLanguageMenu" aria-labelledby="sourceLanguageCaption sourceLanguageValue"><span id="sourceLanguageValue">English</span><i data-lucide="chevron-down" aria-hidden="true"></i></button>
              <div class="language-menu" id="sourceLanguageMenu" hidden>
                <label class="language-search-wrap"><i data-lucide="search" aria-hidden="true"></i><input class="language-search" id="sourceLanguageSearch" type="search" placeholder="Search languages" autocomplete="off" aria-label="Search source languages"></label>
                <div class="language-options" id="sourceLanguageOptions" role="listbox" aria-labelledby="sourceLanguageCaption"></div>
                <p class="language-menu-count" id="sourceLanguageCount">17 languages</p>
              </div>
              <select class="language-native" id="sourceLanguage" aria-label="Source language" tabindex="-1" hidden></select>
            </div>
          </div>
          <button class="swap-button" id="swapButton" type="button" aria-label="Swap languages"><i data-lucide="arrow-left-right" aria-hidden="true"></i></button>
          <div class="language-field">
            <button class="field-label picker-label" id="targetLanguageCaption" type="button" aria-controls="targetLanguageMenu" aria-expanded="false">Target language</button>
            <div class="language-picker" data-language-picker>
              <button class="language-trigger" id="targetLanguageTrigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="targetLanguageMenu" aria-labelledby="targetLanguageCaption targetLanguageValue"><span id="targetLanguageValue">Swahili</span><i data-lucide="chevron-down" aria-hidden="true"></i></button>
              <div class="language-menu" id="targetLanguageMenu" hidden>
                <label class="language-search-wrap"><i data-lucide="search" aria-hidden="true"></i><input class="language-search" id="targetLanguageSearch" type="search" placeholder="Search languages" autocomplete="off" aria-label="Search target languages"></label>
                <div class="language-options" id="targetLanguageOptions" role="listbox" aria-labelledby="targetLanguageCaption"></div>
                <p class="language-menu-count" id="targetLanguageCount">17 languages</p>
              </div>
              <select class="language-native" id="targetLanguage" aria-label="Target language" tabindex="-1" hidden></select>
            </div>
          </div>
        </section>

        <div class="translate-workspace">
          <section class="input-card" aria-label="Text to translate">
            <div class="card-heading"><strong>Text to translate</strong><span id="byteCount">0 / 500 bytes</span></div>
            <label class="sr-only" for="sourceText">Text to translate</label>
            <textarea class="text-input" id="sourceText" placeholder="Enter text to translate…" spellcheck="true"></textarea>
            <div class="input-footer">
              <div class="panel-actions"><button class="action-button" id="micButton" type="button" aria-label="Dictate text" title="Dictate text"><i data-lucide="mic" aria-hidden="true"></i></button><button class="action-button" id="sourceSpeakButton" type="button" aria-label="Listen to source text" title="Listen to source text"><i data-lucide="volume-2" aria-hidden="true"></i></button></div>
              <span class="count-label" id="byteCountFooter">0 / 500</span>
              <button class="action-button" id="clearButton" type="button" aria-label="Clear source text" title="Clear text"><i data-lucide="x" aria-hidden="true"></i></button>
              <button class="translate-button" id="translateButton" type="button">Translate</button>
            </div>
          </section>

          <section class="output-card" aria-label="Translation result">
            <div class="card-heading output-heading"><strong>Translation</strong><span class="language-result"><i data-lucide="languages" aria-hidden="true"></i><span id="targetLanguageName">Swahili</span></span></div>
            <p class="output-text empty" id="outputText">Your translation will appear here.</p>
            <div class="output-footer">
              <button class="action-button" id="speakButton" type="button" aria-label="Listen to translation" title="Listen" disabled><i data-lucide="volume-2" aria-hidden="true"></i></button>
              <span class="footer-spacer"></span>
              <button class="action-button" id="saveButton" type="button" aria-label="Save translation" title="Save translation" aria-pressed="false" disabled><i data-lucide="bookmark" aria-hidden="true"></i></button>
              <button class="action-button" id="copyButton" type="button" aria-label="Copy translation" title="Copy" disabled><i data-lucide="copy" aria-hidden="true"></i></button>
              <button class="action-button" id="thumbsUpButton" type="button" aria-label="Helpful translation" title="Helpful" disabled><i data-lucide="thumbs-up" aria-hidden="true"></i></button>
              <button class="action-button" id="thumbsDownButton" type="button" aria-label="Translation needs improvement" title="Needs improvement" disabled><i data-lucide="thumbs-down" aria-hidden="true"></i></button>
              <button class="action-button" id="shareButton" type="button" aria-label="Share translation" title="Share" disabled><i data-lucide="share-2" aria-hidden="true"></i></button>
            </div>
          </section>
        </div>
        <p class="status" id="statusMessage" role="status" aria-live="polite"></p>
      </section>

      <section class="view secondary-view" id="historyView" aria-label="Translation history">
        <div class="secondary-heading"><div><p>YOUR RECENT WORK</p><h2>History</h2></div><button class="clear-history" id="clearHistoryButton" type="button" hidden>Clear</button></div>
        <div class="history-list" id="historyList"></div><p class="history-empty" id="historyEmpty">Your translations from this session will appear here.</p>
      </section>
      <section class="view secondary-view" id="savedView" aria-label="Saved translations">
        <div class="secondary-heading"><div><p>KEEP IMPORTANT PHRASES</p><h2>Saved</h2></div><button class="clear-history" id="clearSavedButton" type="button" hidden>Clear</button></div>
        <div class="saved-list" id="savedList"></div><p class="history-empty" id="savedEmpty">Translations you save will appear here.</p>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="bottom-item nav" type="button" data-view="translate" aria-controls="translateView" aria-current="page"><span class="bottom-icon" aria-hidden="true"><i data-lucide="house"></i></span><span>Home</span></button>
      <button class="bottom-item nav" type="button" data-view="history" aria-controls="historyView"><span class="bottom-icon" aria-hidden="true"><i data-lucide="history"></i></span><span>History</span></button>
      <button class="bottom-item nav" type="button" data-view="saved" aria-controls="savedView"><span class="bottom-icon" aria-hidden="true"><i data-lucide="bookmark"></i></span><span>Saved</span></button>
    </nav>
  </main>
  <script src="vendor/lucide.min.js"></script>
  <script src="app.js?v=page-flip-20261111"></script>
</body>
</html>
